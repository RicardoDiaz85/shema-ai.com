<!doctype html>
<html lang="en">
    <head>
        <!-- TECHNICAL METADATA -->
        <!-- Keep this identical on every single page. It handles core browser setup like character encoding and mobile screen scaling.-->
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="theme-color" content="#0e0e0e" />

        <!-- PRIMARY SEO METADATA -->
        <!-- The <title> text (e.g., change to "About Us — SHEMA"). -->
        <title>SHEMA — AI-Powered Jewish Context Bible App</title>
        <!-- The <meta name="description"> Update this content. -->
        <meta
            name="description"
            content="Discover the Bible’s Jewish roots with AI-assisted commentary grounded in Messianic Jewish sources."
        />
        <!--The <link rel="canonical"> href URL path.-->
        <!-- <link rel="canonical" href="https://www.shema-ai.com/about" /> -->
        <link rel="canonical" href="https://www.shema-ai.com/" />

        <!-- OPEN GRAPH PROPERTIES -->
        <!-- The og:url content URL.-->
        <meta property="og:url" content="https://www.shema-ai.com/" />

        <!--The og:title text.-->
        <meta
            property="og:title"
            content="SHEMA — AI-Powered Jewish Context Bible App"
        />

        <!-- The og:description text.-->
        <meta
            property="og:description"
            content="Discover the Bible’s Jewish roots with AI-assisted commentary grounded in Messianic Jewish sources."
        />

        <!-- The og:image path (if a specific sub-page needs a unique social sharing preview image). -->
        <meta
            property="og:image"
            content="https://www.shema-ai.com/images/previews/default.svg"
        />
        <meta name="twitter:card" content="summary_large_image" />

        <!-- WEBSITE SCHEMA FROM SCHEMA.ORG -->
        <!-- Change the "@type" from "WebSite" to "WebPage" -->
        <!-- Update the "url" and "description" inside the JSON block to match that specific sub-page. -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "SHEMA",
                "url": "https://www.shema-ai.com",
                "description": "Discover the Bible’s Jewish roots with AI-assisted commentary.",
                "publisher": {
                    "@type": "Organization",
                    "name": "Rooted In Love Outreach",
                    "logo": "https://www.shema-ai.com/shin-favicon.svg",
                    "description": "A registered non-profit ministry dedicated to biblical context education."
                }
            }
        </script>

        <!-- BRANDING AND LINKS -->
        <!-- Keep this identical across all pages so your logo and mobile web app configuration remain stable. -->
        <link rel="icon" href="/favicon.ico" />
        <link rel="icon" href="/shin-favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />

        <!-- ASSETS AND SCRIPTS -->
        <link rel="stylesheet" href="/styles/global.css" />

        <!-- JAVASCRIPT SCRIPTS -->
        <script src="/js/modal.js" defer></script>
        <script src="https://zeffy-scripts.s3.ca-central-1.amazonaws.com/embed-form-script.min.js"></script>
    </head>
    <body></body>
</html>
